[Rainmeter]
; อัปเดตทุกๆ 250ms เพื่อให้ UI เปลี่ยนบรรทัดได้ตรงจังหวะเสียงร้อง
Update=250
AccurateText=1
DynamicWindowSize=1
BackgroundMode=2
SolidColor=0,0,0,1

[Variables]
; ใช้ฟอนต์ที่รองรับภาษาไทยในเครื่อง เช่น Leelawadee UI, Tahoma, หรือ Kanit
FontName=Leelawadee UI
FontSize=16
MaxWidth=800

; ==========================================
; MEASURES (ระบบเชื่อมต่อ)
; ==========================================

[mTitle]
Measure=Plugin
Plugin=WebNowPlaying
PlayerType=Title
RegExpSubstitute=1
Substitute="(?i)- (\d)+ remaster.*":"", "(?i)- (\d)+ version.*":"", "(?i)- radio edit":"", "(?i)[\(-] from.*":"", "(?i)original version":"", "(?i)rerecorded":"", "(?i) \(.*\)":"", "(?i) \[.*\]":""
DynamicVariables=1

[mArtist]
Measure=Plugin
Plugin=WebNowPlaying
PlayerType=Artist
DynamicVariables=1

[mPosition]
Measure=Plugin
Plugin=WebNowPlaying
PlayerType=Position
DynamicVariables=1

[mSearch]
Measure=String
String=[mArtist] [mTitle]
RegExpSubstitute=1
Substitute="-":" ", ",":" ", ":":" ", "/":" "
OnChangeAction=[!CommandMeasure mGetLyrics "Update"]
DynamicVariables=1

[mGetLyrics]
Measure=WebParser
URL=https://lrclib.net/api/search?q=[&mSearch]
RegExp=(?siU)"syncedLyrics":"(.*)"
; บังคับถอดรหัสเป็น UTF-8 เพื่อให้ภาษาไทยไม่เพี้ยน
CodePage=65001
DynamicVariables=1
UpdateRate=100000 

[mParseLyrics]
Measure=Plugin
Plugin=WebParser
URL=[mGetLyrics]
StringIndex=1
DecodeCharacterReference=1
Substitute="":"NO LYRICS AVAILABLE","\n":"|","\r":"","\t":"","\"":""""
; สั่งให้ Lua เข้ามาล้วงข้อมูลเอง โดยไม่ส่งผ่านวงเล็บ เพื่อรักษาภาษาไทย
OnChangeAction=[!CommandMeasure mScript "LoadLyrics()"]
DynamicVariables=1

[mScript]
Measure=Script
ScriptFile=Sync.lua

; ==========================================
; METERS (การแสดงผล 3 บรรทัด)
; ==========================================

[MeterPrev]
Meter=String
Text=""
FontFace=#FontName#
FontSize=#FontSize#
FontColor=255,255,255,100
StringAlign=Center
X=(#MaxWidth#/2)
Y=0
W=#MaxWidth#
ClipString=1
AntiAlias=1

[MeterCurr]
Meter=String
Text="Waiting for music..."
FontFace=#FontName#
FontSize=#FontSize#
FontWeight=700
FontColor=255,255,255,255
StringAlign=Center
X=0r
Y=35r
W=#MaxWidth#
ClipString=1
AntiAlias=1

[MeterNext]
Meter=String
Text=""
FontFace=#FontName#
FontSize=#FontSize#
FontColor=255,255,255,100
StringAlign=Center
X=0r
Y=35r
W=#MaxWidth#
ClipString=1
AntiAlias=1